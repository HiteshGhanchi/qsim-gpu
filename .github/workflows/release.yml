name: Release

# Pushing a tag like v0.2.0 builds the package and publishes it to TestPyPI.
# Publishing to the real PyPI only happens when started by hand (Actions -> Release ->
# Run workflow, target = pypi). Both use PyPI trusted publishing: no tokens are stored in the
# repository. One-time setup on test.pypi.org and pypi.org: add this repository and this
# workflow file (release.yml) as a trusted publisher, with environments "testpypi" and "pypi".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          pip install build
          python -m build
          python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'push' || inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
